<div class="grafana-embed-page" *ngIf="configuredUrl; else missingUrl">
  <app-page-skeleton *ngIf="!iframeReady" variant="canvas" class="grafana-sk"></app-page-skeleton>
  <iframe
    class="grafana-embed-frame"
    [class.grafana-embed-frame--ready]="iframeReady"
    [src]="grafanaUrl"
    title="Dashboard Grafana"
    referrerpolicy="no-referrer-when-downgrade"
    allowfullscreen
    (load)="iframeReady = true">
  </iframe>
</div>

<ng-template #missingUrl>
  <div class="grafana-embed-missing">
    <p>No hay URL de Grafana configurada.</p>
    <p>Definí <code>grafanaEmbedUrl</code> en <code>environment.ts</code>.</p>
  </div>
</ng-template>
