<div class="almacenes-container">
  <app-notification-container></app-notification-container>

  <div class="header-section">
    <div class="title-wrapper">
      <h1 id="tour-almacenes-title">
        <i class="fas fa-warehouse"></i>
        Gestión de Almacenes
      </h1>
    </div>
  </div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-2">Cargando almacenes...</p>
  </div>

  <div *ngIf="error" class="alert alert-danger">
    <i class="fas fa-exclamation-circle me-2"></i>
    {{ error }}
  </div>

  <div *ngIf="!loading && !error" class="cerbero-folder-stage">
    <nav
      *ngIf="almacenes.length > 0"
      class="cerbero-folder-tabs almacenes-tabs"
      id="tour-almacenes-cards"
      role="tablist"
      aria-label="Almacenes">
      <button
        *ngFor="let almacen of almacenes"
        type="button"
        role="tab"
        class="cerbero-folder-tab almacenes-tab"
        [class.cerbero-folder-tab--active]="almacenStockInline?.id === almacen.id"
        [attr.aria-selected]="almacenStockInline?.id === almacen.id"
        [attr.aria-label]="almacen.numero + ' ' + almacen.nombre"
        (click)="verStockAlmacen(almacen)">
        <span class="cerbero-folder-tab-icon" aria-hidden="true">
          <i class="fas fa-warehouse"></i>
        </span>
        <span class="almacenes-tab-code">{{ almacen.numero }}</span>
        <span class="almacenes-tab-name">{{ almacen.nombre }}</span>
      </button>
    </nav>

    <section
      *ngIf="almacenStockInline"
      class="content-section cerbero-folder-panel stock-inline-panel"
      role="tabpanel">
      <app-stock-almacen [embedStock]="true" [embeddedAlmacenId]="almacenStockInline.id"></app-stock-almacen>
    </section>

    <div *ngIf="almacenes.length === 0" class="content-section cerbero-folder-panel">
      <div class="empty-state">
        <i class="fas fa-warehouse fa-3x text-muted mb-3"></i>
        <h5 class="text-muted">No hay almacenes disponibles</h5>
        <p class="text-muted mb-0">
          Creá almacenes desde
          <a routerLink="/menu/almacen/configuracion">Configuración de almacén</a>.
        </p>
      </div>
    </div>
  </div>
</div>
