<div
  class="sidenav"
  [style.--layout-top.px]="layoutTopPx">
  <nav class="sidenav-nav" aria-label="Menú principal">
  <!-- Menú de navegación -->
  <a routerLink="/menu/dashboard" routerLinkActive="active" class="nav-tile nav-tile--violet">
    <i class="fas fa-tachometer-alt"></i>
    <span>DASHBOARD</span>
  </a>
  
  <!-- Menú expandible de Activos -->
  <div class="menu-item" [class.expanded]="isAssetsExpanded">
    <div class="menu-header nav-tile nav-tile--cyan" (click)="toggleAssetsMenu()">
      <i class="fas fa-desktop"></i>
      <span>ACTIVOS</span>
    </div>
    <div class="submenu" [class.show]="isAssetsExpanded">
      <a routerLink="/menu/assets" routerLinkActive="active" class="submenu-item submenu-item--sky">
        <i class="fas fa-laptop"></i>
        <span>TERMINALES</span>
      </a>
      <a routerLink="/menu/devices" routerLinkActive="active" class="submenu-item submenu-item--teal">
        <i class="fas fa-hdd"></i>
        <span>DISPOSITIVOS</span>
      </a>
      <a *ngIf="canManageSubnets()" routerLink="/menu/subnets" routerLinkActive="active" class="submenu-item submenu-item--blue">
        <i class="fas fa-network-wired"></i>
        <span>SUB REDES</span>
      </a>
    </div>
  </div>

  <a routerLink="/menu/software" routerLinkActive="active" class="nav-tile nav-tile--green">
    <i class="fas fa-code"></i>
    <span>SOFTWARE</span>
  </a>

  <a routerLink="/menu/procurement/activos" routerLinkActive="active" class="nav-tile nav-tile--orange">
    <i class="fas fa-box"></i>
    <span>INVENTARIO</span>
  </a>

  <a *ngIf="canAccessTickets()" routerLink="/menu/tickets" routerLinkActive="active" class="nav-tile nav-tile--rose">
    <i class="fas fa-ticket-alt"></i>
    <span>TICKETS</span>
  </a>

  <!-- Menú expandible de Adquisiciones -->
  <div class="menu-item" [class.expanded]="isAdquisicionesExpanded">
    <div class="menu-header nav-tile nav-tile--blue" (click)="toggleAdquisicionesMenu()">
      <i class="fas fa-shopping-cart"></i>
      <span>ADQUISICIONES</span>
    </div>
    <div class="submenu" [class.show]="isAdquisicionesExpanded">
      <a routerLink="/menu/procurement/compras" routerLinkActive="active" class="submenu-item submenu-item--blue">
        <i class="fas fa-shopping-bag"></i>
        <span>COMPRAS</span>
      </a>
      <a routerLink="/menu/procurement/proveedores" routerLinkActive="active" class="submenu-item submenu-item--indigo">
        <i class="fas fa-industry"></i>
        <span>PROVEEDOR</span>
      </a>
      <!-- <a routerLink="/menu/procurement/servicios-garantia" routerLinkActive="active" class="submenu-item">
        <i class="fas fa-shield-alt"></i>
        <span>GARANTÍA</span>
      </a> -->
    </div>
  </div>

  <!-- Menú expandible de Almacén -->
  <div class="menu-item" [class.expanded]="isAlmacenExpanded">
    <div class="menu-header nav-tile nav-tile--amber" (click)="toggleAlmacenMenu()">
      <i class="fas fa-warehouse"></i>
      <span>ALMACÉN</span>
    </div>
    <div class="submenu" [class.show]="isAlmacenExpanded">
      <a routerLink="/menu/almacen/almacenes" routerLinkActive="active" class="submenu-item submenu-item--amber">
        <i class="fas fa-building"></i>
        <span>ALMACENES</span>
      </a>
      <a routerLink="/menu/cementerio" routerLinkActive="active" class="submenu-item submenu-item--rose">
        <i class="fas fa-skull-crossbones"></i>
        <span>CEMENTERIO</span>
      </a>
      <a routerLink="/menu/almacen-laboratorio" routerLinkActive="active" class="submenu-item submenu-item--green">
        <i class="fas fa-archive"></i>
        <span>ALMACEN LAB</span>
      </a>
      <a *ngIf="canAccessWarehouseConfiguration()" routerLink="/menu/almacen/configuracion" routerLinkActive="active" class="submenu-item submenu-item--orange">
        <i class="fas fa-cogs"></i>
        <span>CONFIG. ALMACÉN</span>
      </a>
    </div>
  </div>

  <!--
    Configuración: hub con pestañas (ubicaciones, tipos, responsables, tickets).
    GM/Admin ven todas las pestañas; INVENTARIO ve ubicaciones, tipos de activo y responsables.
  -->
  <a *ngIf="canShowConfigurationMenu()" routerLink="/menu/configuracion" routerLinkActive="active" class="nav-tile nav-tile--gear">
    <i class="fas fa-cog"></i>
    <span>CONFIGURACIÓN</span>
  </a>

  <!-- Menú expandible de Administración - Solo visible para GM y Admin -->
  <div class="menu-item" [class.expanded]="isAdminExpanded" *ngIf="canAccessAdministration()">
    <div class="menu-header nav-tile nav-tile--purple" (click)="toggleAdminMenu()">
      <i class="fas fa-user-shield"></i>
      <span>ADMINISTRACIÓN</span>
    </div>
    <div class="submenu" [class.show]="isAdminExpanded">
      <a *ngIf="isGM()" routerLink="/menu/settings" routerLinkActive="active" class="submenu-item submenu-item--orange">
        <i class="fas fa-database"></i>
        <span>BASE DE DATOS</span>
      </a>
      <a *ngIf="canManageUsers()" routerLink="/menu/user-management" routerLinkActive="active" class="submenu-item submenu-item--purple">
        <i class="fas fa-user-cog"></i>
        <span>USUARIOS</span>
      </a>
    </div>
  </div>

  <a *ngIf="canAccessInternosOse()" routerLink="/menu/internos-ose" routerLinkActive="active" class="nav-tile nav-tile--teal">
    <i class="fas fa-address-book"></i>
    <span>GUÍA DE CONTACTOS</span>
  </a>
  </nav>

  <!-- Espacio reservado: el perro vive en .dog-anchor (fixed) encima de la versión -->
  <div class="dog-spacer" aria-hidden="true"></div>

  <!-- Información de versión en la parte inferior del menú -->
  <div class="version-info">
    <div class="version-content">
      <span class="app-name">{{ versionInfo.codename }}</span>
      <span class="build-info">{{ versionInfo.buildInfo }}</span>
    </div>
  </div>
</div>

<!-- Fuera del sidenav: burbujas y menú radial no quedan recortados ni detrás del contenido -->
<div class="dog-anchor">
  <app-helper-dog></app-helper-dog>
</div>

<app-header></app-header>
<div
  class="main-content"
  [style.margin-top.px]="layoutTopPx"
  [style.--layout-top.px]="layoutTopPx">
  <router-outlet></router-outlet>
</div>
