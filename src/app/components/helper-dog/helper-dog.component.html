<div class="helper-dog" [class.chat-open]="chatAbierto">
  <div class="helper-dog-container">
    <div
      class="dog-chat"
      *ngIf="chatMontado"
      [hidden]="!chatAbierto"
      (click)="$event.stopPropagation()">
      <app-asistente [compacto]="true"></app-asistente>
    </div>

    <img
      src="assets/awoo-awoo-shoppe.gif"
      alt="Asistente"
      class="helper-dog-image"
      [class.bounce]="isBouncing"
      (click)="onDogClick($event)">
  </div>
</div>
