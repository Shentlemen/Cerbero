<header class="app-header">
  <div class="header-container">
    <div class="header-left">
      <div class="app-brand">
        <img src="assets/logoHeader.jpg" alt="Cerbero Logo" class="header-logo">
        <span class="app-name">Cerbero</span>
      </div>
    </div>

    <div class="header-right" *ngIf="currentUser">
      <div class="user-menu" #userMenu>
        <button
          type="button"
          class="user-menu-trigger"
          (click)="toggleMenu($event)"
          [attr.aria-expanded]="menuOpen"
          aria-haspopup="menu"
          title="Menú de cuenta">
          <span class="user-menu-avatar-wrap" aria-hidden="true">
            <img
              *ngIf="hasAvatar"
              class="user-menu-avatar"
              [src]="avatarUrl"
              alt=""
              (error)="onAvatarError()">
            <span *ngIf="!hasAvatar" class="user-menu-avatar user-menu-avatar--initials">{{ headerInitials }}</span>
          </span>
          <span class="user-name">{{ displayName }}</span>
          <span
            class="role-badge"
            [ngClass]="getRoleBadgeClass(effectiveRole)"
            [title]="roleBadgeTitle || getRoleLabel(effectiveRole)">
            <i class="fas role-badge-icon" [ngClass]="getRoleIcon(effectiveRole)" aria-hidden="true"></i>
            <span class="role-badge-label">{{ getRoleLabel(effectiveRole) }}</span>
          </span>
          <i class="fas fa-chevron-down user-menu-caret" [class.user-menu-caret--open]="menuOpen" aria-hidden="true"></i>
        </button>

        <div class="user-menu-dropdown" *ngIf="menuOpen" role="menu">
          <button type="button" class="user-menu-item" role="menuitem" (click)="goToProfile()">
            <i class="fas fa-user-circle" aria-hidden="true"></i>
            <span>Mi perfil</span>
          </button>

          <button type="button" class="user-menu-item" role="menuitem" (click)="toggleTheme()">
            <i class="fas" [ngClass]="theme.isDark() ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
            <span>{{ theme.isDark() ? 'Modo claro' : 'Modo oscuro' }}</span>
          </button>

          <ng-container *ngIf="isRealGm">
            <div class="user-menu-sep" role="separator"></div>
            <div
              class="user-menu-flyout"
              [class.user-menu-flyout--open]="viewAsOpen"
              (mouseenter)="openViewAsPanel()"
              (mouseleave)="closeViewAsPanel()">
              <button
                type="button"
                class="user-menu-item user-menu-item--flyout"
                role="menuitem"
                aria-haspopup="true"
                [attr.aria-expanded]="viewAsOpen"
                (click)="toggleViewAsPanel($event)">
                <i class="fas fa-theater-masks" aria-hidden="true"></i>
                <span class="user-menu-flyout-label">Ver como</span>
                <span class="user-menu-flyout-current">{{ viewAsSelectValue ? getRoleLabel(viewAsSelectValue) : 'Game Master' }}</span>
                <i class="fas fa-chevron-left user-menu-flyout-caret" aria-hidden="true"></i>
              </button>
              <div class="user-menu-roles-panel" role="menu" aria-label="Ver la aplicación como">
                <p class="user-menu-section-label">Ver la aplicación como</p>
                <button
                  type="button"
                  class="user-menu-item user-menu-item--role"
                  *ngFor="let o of viewAsOptions"
                  role="menuitemradio"
                  [attr.aria-checked]="viewAsSelectValue === o.value"
                  [class.user-menu-item--active]="viewAsSelectValue === o.value"
                  (click)="onViewAsChange(o.value)">
                  <i class="fas" [ngClass]="viewAsSelectValue === o.value ? 'fa-check' : getRoleIcon(o.value || 'GM')" aria-hidden="true"></i>
                  <span>{{ o.label }}</span>
                </button>
              </div>
            </div>
          </ng-container>

          <div class="user-menu-sep" role="separator"></div>
          <button type="button" class="user-menu-item user-menu-item--danger" role="menuitem" (click)="logout()">
            <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
            <span>Cerrar sesión</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="gm-preview-bar" *ngIf="showPreviewBar">
    <i class="fas fa-theater-masks gm-preview-bar-icon" aria-hidden="true"></i>
    <span class="gm-preview-bar-text">
      Vista previa como <strong>{{ getRoleLabel(previewRole) }}</strong>.
      Tu sesión sigue siendo <strong>Game Master</strong>; el servidor aplica el rol real del token.
    </span>
    <button type="button" class="btn btn-sm gm-preview-bar-btn" (click)="clearPreview()">
      Volver a GM
    </button>
  </div>
</header>
